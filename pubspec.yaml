name: sinflix
description: "SinFlix — catálogo multiplataforma de películas y series (iOS, Android, Web, Windows, macOS, Linux)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Estado y navegación ────────────────────────────────────────────────
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # ── Red ────────────────────────────────────────────────────────────────
  dio: ^5.11.1

  # ── Backend: autenticación + base de datos (opcional, ver docs/SETUP.md)
  supabase_flutter: ^2.18.0

  # ── Persistencia local (mi lista sin conexión / modo demo) ─────────────
  shared_preferences: ^2.5.6

  # ── UI ─────────────────────────────────────────────────────────────────
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0
  url_launcher: ^6.3.3

  # ── Utilidades ─────────────────────────────────────────────────────────
  intl: ^0.20.3
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Catálogo de respaldo para que la app funcione SIN configurar nada.
    - assets/data/demo_catalog.json
