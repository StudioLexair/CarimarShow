  # ════════════════════════════════════════════════════════════════════════
  #  PUBLICAR
  # ════════════════════════════════════════════════════════════════════════
  publish:
    name: Crear Release
    needs: [meta, android, web, windows, linux, macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Recopilar binarios y calcular checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          cd release
          # SHA-256 de cada binario: permite verificar que la descarga no se ha
          # corrompido ni manipulado. Se publica como asset y se enlaza en la web.
          #
          # Se excluye el propio SHA256SUMS.txt del globo: si no, la redirección
          # lo crea vacío antes de expandir `*` y acaba incluyéndose a sí mismo.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS.txt
          echo "───────── contenido del release ─────────"
          ls -la
          echo "───────── SHA256SUMS.txt ─────────"
          cat SHA256SUMS.txt

      - name: Generar notas de la versión
        id: notes
        run: |
          {
            echo "## CarimarShow $VERSION"
            echo
            echo "**Descarga directa:** [studiolexair.github.io/CarimarShow](https://studiolexair.github.io/CarimarShow/) — detecta tu dispositivo y te da el archivo correcto."
            echo
            echo "### Qué bajar"
            echo
            echo "| Dispositivo | Archivo |"
            echo "|---|---|"
            echo "| Android (la mayoría, 2017+) | \`-android-arm64-v8a.apk\` |"
            echo "| Android antiguo o gama baja | \`-android-armv7.apk\` |"
            echo "| Android, si no sabes cuál | \`-android-universal.apk\` |"
            echo "| Windows 10/11 (64 bits) | \`-windows-x64.zip\` |"
            echo "| Linux (Debian/Ubuntu) | \`-linux-amd64.deb\` |"
            echo "| Linux (cualquier distro) | \`-linux-x64.tar.gz\` |"
            echo "| Mac con chip M1/M2/M3/M4 | \`-macos-arm64.zip\` |"
            echo "| Mac con Intel | \`-macos-x64.zip\` |"
            echo "| Cualquier navegador | \`-web.zip\` o la [app web](https://studiolexair.github.io/CarimarShow/app/) |"
            echo
            echo "### Android: «instalación de origen desconocido»"
            echo
            echo "El APK está firmado con la clave de release del proyecto, pero al no venir"
            echo "de Google Play el sistema pedirá permiso para instalar apps de origen"
            echo "desconocido. Es un aviso normal en toda instalación fuera de tienda."
            echo
            echo "### macOS: clic derecho → Abrir"
            echo
            echo "Sin firma ni notarización de Apple (requiere cuenta de Apple Developer)."
            echo "Clic derecho sobre la app → **Abrir**, o bien:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /ruta/a/CarimarShow.app"
            echo '```'
            echo
            echo "### iOS"
            echo
            echo "Todavía no: distribuir un \`.ipa\` instalable exige una cuenta de Apple"
            echo "Developer. Mientras tanto, la [versión web](https://studiolexair.github.io/CarimarShow/app/)"
            echo "funciona en Safari y se puede añadir a la pantalla de inicio."
            echo
            echo "### Verificar la descarga"
            echo
            echo '```'
            echo "sha256sum carimarshow-$VERSION-android-arm64-v8a.apk"
            echo "grep android-arm64 SHA256SUMS.txt"
            echo '```'
            echo
            echo "### Cambios desde la versión anterior"
            echo
            git log --oneline --no-decorate "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD 2>/dev/null \
              | sed 's/^/- /' || echo "- Primera versión publicada."
          } > NOTES.md
          echo "notas generadas: $(wc -l < NOTES.md) líneas"

      - name: Crear el Release y subir los binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CarimarShow ${{ env.VERSION }}
          body_path: release/NOTES.md
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            release/*.apk
            release/*.aab
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/SHA256SUMS.txt
            release/LEEME-*.txt
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Resumen
        run: |
          {
            echo "## ✅ Release $TAG publicado"
            echo
            echo "🔗 https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo
            echo "### Binarios"
            echo '```'
            ls -la release | grep -vE '^total|^d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # La web de descarga necesita saber qué versión acaba de salir. Se
      # dispara el despliegue de Pages para que regenere `release.json`.
      - name: Disparar el despliegue de la web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run site.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f triggered_by="release $TAG" \
            || echo "::warning::No se pudo disparar site.yml; la web se actualizará en el próximo push a main."
